[package]
name = "storage-doctor"
version = "1.0.0"
description = "Understand why your storage is filling up and clean it safely."
authors = ["HutZon"]
edition = "2021"

[lib]
name = "storage_doctor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
sysinfo = "0.33"
rayon = "1"
chrono = "0.4"
trash = "5"
winreg = "0.55"
sha2 = "0.10"
dirs = "5"
thiserror = "2"

[profile.release]
strip = true
lto = true
codegen-units = 1
