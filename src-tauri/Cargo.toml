[package]
name = "storage-doctor"
version = "1.1.1"
description = "Understand why your storage is filling up and clean it safely."
authors = ["HutZon"]
edition = "2021"

[lib]
name = "storage_doctor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
sysinfo = "0.33"
rayon = "1"
chrono = "0.4"
trash = "5"
winreg = "0.55"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_Registry",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
# Shell imaging (app icons / file thumbnails) needs real COM interfaces.
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_ApplicationInstallationAndServicing",
  "Win32_System_Com",
  "Win32_UI_Shell",
] }
png = "0.17"
base64 = "0.22"
sha2 = "0.10"
dirs = "5"
thiserror = "2"

[profile.release]
strip = true
lto = true
codegen-units = 1
